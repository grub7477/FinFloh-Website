<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',sans-serif">
  <defs>
    <clipPath id="bgClip3"><rect x="0" y="0" width="1200" height="1000" rx="28"/></clipPath>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7C8873"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1000" rx="28" fill="#DEE1C6"/>

  <g clip-path="url(#bgClip3)">
    <!-- decorative blobs -->
    <circle cx="60" cy="960" r="220" fill="#D2D6B4" opacity="0.45"/>
    <circle cx="1160" cy="40" r="180" fill="#CBCF9F" opacity="0.4"/>

    <!-- ============ TOP ROW: Contract -> Engine -> Invoice ============ -->

    <!-- Contract card -->
    <g>
      <rect x="80" y="110" width="300" height="280" rx="18" fill="#F8F7EA"/>
      <path d="M80,128 a18,18 0 0 1 18,-18 h264 a18,18 0 0 1 18,18 v26 h-300 z" fill="#2F6B41"/>
      <text x="230" y="139" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Contract</text>

      <text x="100" y="185" font-size="12" fill="#8A8A78">Extracted Terms</text>

      <rect x="100" y="200" width="220" height="34" rx="17" fill="#EAE8CF"/>
      <text x="210" y="222" font-size="12" font-weight="600" fill="#1C3326" text-anchor="middle">Milestone Billing</text>

      <rect x="100" y="246" width="260" height="34" rx="17" fill="#EAE8CF"/>
      <text x="230" y="268" font-size="12" font-weight="600" fill="#1C3326" text-anchor="middle">Net 30 Payment Terms</text>

      <rect x="100" y="292" width="260" height="34" rx="17" fill="#DCEFDF"/>
      <text x="230" y="314" font-size="12" font-weight="700" fill="#2F6B41" text-anchor="middle">$120,000 Contract Value</text>

      <circle cx="107" cy="352" r="5" fill="#2F6B41"/>
      <text x="120" y="356" font-size="11" fill="#7C8873">Synced from AR system</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="384" y1="250" x2="500" y2="250" stroke="#7C8873" stroke-width="2.5" marker-end="url(#arrowHead)"/>
    <text x="442" y="232" font-size="12" fill="#4B5B45" text-anchor="middle">Terms Applied</text>

    <!-- Engine -->
    <g transform="translate(600,250)">
      <circle r="95" fill="#A6A473"/>
      <circle r="64" fill="#EAE8CF"/>
      <circle cx="86" cy="-52" r="6" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="-90" cy="-30" r="4" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="70" cy="70" r="5" fill="#FFFFFF" opacity="0.6"/>
      <path d="M-8,-30 L14,-4 L2,-4 L8,30 L-16,-2 L-4,-2 Z" fill="#2F6B41"/>
    </g>
    <text x="600" y="380" font-size="14" font-weight="700" fill="#1C3326" text-anchor="middle">Contract-Driven</text>
    <text x="600" y="400" font-size="14" font-weight="700" fill="#1C3326" text-anchor="middle">Invoicing Engine</text>

    <!-- Arrow 2 -->
    <line x1="700" y1="250" x2="816" y2="250" stroke="#7C8873" stroke-width="2.5" marker-end="url(#arrowHead)"/>
    <text x="757" y="232" font-size="12" fill="#4B5B45" text-anchor="middle">Auto-Generated</text>

    <!-- Invoice card -->
    <g>
      <rect x="820" y="110" width="300" height="280" rx="18" fill="#FFFFFF"/>
      <path d="M820,128 a18,18 0 0 1 18,-18 h264 a18,18 0 0 1 18,18 v26 h-300 z" fill="#2F6B41"/>
      <text x="970" y="139" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Invoice</text>

      <rect x="1000" y="164" width="90" height="26" rx="13" fill="#DCEFDF"/>
      <text x="1045" y="181" font-size="11" font-weight="700" fill="#2F6B41" text-anchor="middle">On Time</text>

      <text x="840" y="207" font-size="12" fill="#8A8A78">Bill To</text>
      <text x="840" y="228" font-size="15" font-weight="600" fill="#1C3326">Acme Industries</text>

      <text x="840" y="258" font-size="12" fill="#8A8A78">Amount Due</text>
      <text x="840" y="284" font-size="22" font-weight="700" fill="#1C3326">$120,000</text>

      <text x="840" y="314" font-size="12" fill="#8A8A78">Due Date</text>
      <text x="840" y="334" font-size="15" font-weight="600" fill="#1C3326">Aug 30, 2026</text>

      <circle cx="852" cy="358" r="10" fill="#DCEFDF"/>
      <path d="M847,358 l4,4 l8,-9" stroke="#2F6B41" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="362" font-size="12" fill="#4B5B45">Matches contract terms exactly</text>
    </g>

    <!-- ============ LEAK DETECTION FLOW ============ -->

    <!-- Leak card -->
    <g>
      <rect x="80" y="440" width="340" height="210" rx="18" fill="#FBF1DD"/>
      <path d="M80,458 a18,18 0 0 1 18,-18 h304 a18,18 0 0 1 18,18 v26 h-340 z" fill="#C9A66B"/>
      <text x="250" y="469" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Revenue Leak Detected</text>

      <path d="M110,520 l10,-18 l10,18 z" fill="none" stroke="#A87F35" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="120" cy="516" r="1.4" fill="#A87F35"/>
      <line x1="120" y1="507" x2="120" y2="512" stroke="#A87F35" stroke-width="2"/>

      <text x="150" y="503" font-size="13" font-weight="700" fill="#6B4E1E">Milestone 3 — Implementation</text>
      <text x="150" y="524" font-size="12" fill="#9A8358" text-decoration="line-through">Invoice not generated</text>
      <text x="150" y="556" font-size="22" font-weight="700" fill="#6B4E1E">$18,500</text>

      <text x="110" y="610" font-size="11" fill="#9A8358">Flagged automatically against the</text>
      <text x="110" y="626" font-size="11" fill="#9A8358">contract's milestone billing schedule</text>
    </g>

    <!-- Arrow between leak and resolved -->
    <line x1="424" y1="545" x2="736" y2="545" stroke="#7C8873" stroke-width="2.5" marker-end="url(#arrowHead)"/>
    <text x="580" y="527" font-size="12" fill="#4B5B45" text-anchor="middle">Auto-Flagged &amp; Invoiced</text>

    <!-- Resolved card -->
    <g>
      <rect x="740" y="440" width="340" height="210" rx="18" fill="#EAF5EC"/>
      <path d="M740,458 a18,18 0 0 1 18,-18 h304 a18,18 0 0 1 18,18 v26 h-340 z" fill="#2F6B41"/>
      <text x="910" y="469" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Leak Prevented</text>

      <circle cx="780" cy="504" r="11" fill="#DCEFDF"/>
      <path d="M775,504 l4,4 l8,-9" stroke="#2F6B41" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="800" y="508" font-size="13" font-weight="700" fill="#1C3326">Invoice #INV-1043 Generated</text>

      <text x="770" y="556" font-size="22" font-weight="700" fill="#2F6B41">$18,500 Recovered</text>

      <text x="770" y="610" font-size="11" fill="#4B5B45">Sent to Acme Industries — Aug 12, 2026</text>
    </g>

    <!-- ============ TREND STRIP ============ -->
    <g>
      <rect x="80" y="700" width="1040" height="200" rx="20" fill="#FFFFFF"/>

      <text x="110" y="742" font-size="13" fill="#8A8A78">Revenue Recovered This Quarter</text>
      <text x="110" y="790" font-size="34" font-weight="700" fill="#1C3326">$142,000</text>
      <text x="110" y="814" font-size="12" fill="#7C8873">Across 27 previously missed billings</text>

      <!-- sparkline -->
      <path d="M650,870 L650,850 L720,830 L790,800 L860,772 L930,760 L1000,740 L1070,735 L1070,870 Z" fill="#2F6B41" opacity="0.15"/>
      <polyline points="650,850 720,830 790,800 860,772 930,760 1000,740 1070,735" fill="none" stroke="#2F6B41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1070" cy="735" r="5" fill="#2F6B41"/>

      <rect x="985" y="700" width="95" height="28" rx="14" fill="#DCEFDF"/>
      <text x="1032" y="719" font-size="12" font-weight="700" fill="#2F6B41" text-anchor="middle">+18%</text>
    </g>

  </g>
</svg>
